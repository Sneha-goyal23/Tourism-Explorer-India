<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourism Explorer India</title>

    <link href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&family=MonteCarlo&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="explore.css">

</head>
<body>
    <div class="landing-page">
        <div class="brand">
            <div class="glass-circle">
                <!-- Camera content goes here -->
                <div class ="camera">
                    <div class="camera-top">
                        <div class="viewfinder"></div>
                        <div class="camera-button"></div>
                    </div>

                    <div class="camera-flash"></div>

                    <div class="camera-lens">
                        <div class="lens-inner">
                            <div class="lens-reflection"></div>
                        </div>
                    </div>
                    
                    <div class="photo">
                        <div class="photo-scene">
                            <div class="photo-sun"></div>
                            <div class="photo-mountain mountain-back"></div>
                            <div class="photo-mountain mountain-front"></div>
                            <div class="photo-ground"></div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Web site name-->
            <div class="website-name">
                <h1>R.a.a.h.i</h1>
            </div>
        </div>

        <div class="intro-container">
            <h2>Main udna chahta hoon, daudna chahta hoon</h2>
            <h2>Girna bhi chahta hoon... bas rukna nahi chahta!</h2>
        </div>

        <!-- Start button-->
        <div class="login-container">
            <section class="last">
                <button type="button" class="explore-button" onclick="window.location.href='explore.html'">
                    Ready to Plan Your Trip BUNNY!
                </button>
            </section>
        </section>
    </div>
</div>
</body>
</html>
